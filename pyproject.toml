[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-training"
version = "0.1.0"
description = "Agenttisen koodauksen koulutus data-analyytikoille"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.24",
    "requests",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "streamlit>=1.50",
]

[tool.setuptools]
packages = []
