<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup</title>
<style>
:root { --chrome:#1c1e23; --canvas:#15161a; --dot:#2c2f36; --line:#2b2e35; --hover:#33363e; --ink:#e6e7ea; --ink2:#9ba1ab; --note:#ffcf6b; --note-ink:#2e2306;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--canvas); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
button, textarea { font: inherit; color: inherit; }
button { background: transparent; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover { background: var(--hover); }
:focus-visible { outline: 2px solid #9cc7ff; outline-offset: 1px; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
header { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 16px; background: var(--chrome); border-bottom: 1px solid var(--line); }
header h1 { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { margin-right: auto; color: var(--ink2); font-size: 12px; }
#copy { background: var(--note); color: var(--note-ink); font-weight: 600; }
#copy:hover { background: #ffdb8a; }
#stage { position: absolute; inset: 48px 0 0 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--canvas) radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 22px 22px; }
#stage.dragging { cursor: grabbing; }
#stage.commenting { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.frame { position: absolute; background: white; box-shadow: 0 12px 40px #0006; border-radius: 3px; }
.frame .label { position: absolute; bottom: 100%; left: 0; padding: 6px 0; color: var(--ink2); white-space: nowrap; }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
#pins { position: absolute; left: 0; top: 0; }
.pin-wrap { position: absolute; width: 0; height: 0; transform: scale(var(--inv, 1)); transform-origin: 0 0; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; padding: 0; justify-content: center; border-radius: 50% 50% 50% 4px; background: var(--note); color: var(--note-ink); font-weight: 700; font-size: 12px; box-shadow: 0 2px 8px #0007; }
.pin:hover { background: #ffdb8a; }
.pin-del { position: absolute; left: 8px; top: -24px; width: 20px; height: 20px; padding: 0; justify-content: center; border-radius: 50%; background: var(--chrome); box-shadow: 0 0 0 1px var(--line); visibility: hidden; }
.pin-del .i { width: 12px; height: 12px; stroke-width: 2.25; }
.pin-del:hover { background: #c2413b; }
.pin-wrap:hover .pin-del, .pin-wrap:focus-within .pin-del { visibility: visible; }
.dock { position: absolute; z-index: 3; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--chrome); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px #0006; }
.dock .icon { width: 34px; height: 34px; padding: 0; justify-content: center; }
.dock [aria-pressed=true] { background: var(--ink); color: var(--canvas); }
.dock #mode-comment[aria-pressed=true] { background: var(--note); color: var(--note-ink); }
#zoom-reset { min-width: 56px; justify-content: center; color: var(--ink2); font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
dialog { color: inherit; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; width: min(520px, calc(100% - 32px)); padding: 18px; }
dialog::backdrop { background: #0009; }
dialog h2 { font-size: 14px; margin: 0 0 10px; }
dialog textarea { width: 100%; min-height: 120px; padding: 10px; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
.row { display: flex; gap: 6px; margin-top: 12px; }
.grow { flex: 1; }
#editor-save { background: var(--ink); color: var(--canvas); font-weight: 600; }
#editor-delete { color: #ff8a80; }
</style>
</head>
<body>
<header>
  <h1 id="title">Mockup</h1>
  <span id="status" role="status"></span>
  <button id="copy" title="Kopioi kommentit ja niiden kohdat, ja liitä ne agentin chattiin">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H5v16h14V5h-3M9 12h6M9 16h4"/></svg>Kopioi kommentit agentille
  </button>
</header>
<main id="stage" aria-label="Kangas: raahaa siirtääksesi, rullaa zoomataksesi"><div id="world"><div id="frames"></div><div id="pins"></div></div></main>
<div class="dock" role="toolbar" aria-label="Työkalut">
  <button id="mode-move" class="icon" aria-pressed="true" title="Siirrä kangasta (V)" aria-label="Siirrä"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a5 5 0 0 1-3.8-1.8L3.6 15.6a1.5 1.5 0 0 1 2.3-1.9L8 16"/></svg></button>
  <button id="mode-comment" class="icon" aria-pressed="false" title="Kommentoi: klikkaa näkymää (C)" aria-label="Kommentoi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M12 8v5M9.5 10.5h5"/></svg></button>
  <span class="sep"></span>
  <button id="zoom-out" class="icon" title="Loitonna" aria-label="Loitonna"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
  <button id="zoom-reset" title="Palauta 100 %">100 %</button>
  <button id="zoom-in" class="icon" title="Lähennä" aria-label="Lähennä"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
  <button id="fit" class="icon" title="Sovita kaikki näkymät" aria-label="Sovita"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="screens">
<template class="screen" data-id="esimerkki" data-title="Esimerkkinäkymä" data-w="800" data-h="500">
<style>body { margin: 0; font: 18px system-ui, sans-serif; display: grid; place-items: center; height: 100vh; background: #f4f5f7; color: #333; }</style>
<p>Korvaa tämä näkymä omilla vaihtoehdoillasi.</p>
</template>
</div>
<dialog id="editor"><h2>Kommentti</h2><textarea id="editor-text" aria-label="Kommentin teksti"></textarea>
  <div class="row"><button id="editor-delete" hidden>Poista</button><span class="grow"></span><button id="editor-cancel">Peruuta</button><button id="editor-save">Tallenna</button></div></dialog>
<dialog id="copy-dialog"><h2>Kopioi tämä teksti agentille</h2><textarea id="copy-text" readonly aria-label="Kommentit agentille"></textarea>
  <div class="row"><span class="grow"></span><button id="copy-close">Sulje</button></div></dialog>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'mockup:' + location.pathname;
  const GAP = 80, DOCK = 70;
  // Näkymät ajetaan eristetyssä iframessa ilman verkkoa.
  const CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">`;
  const X_ICON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  const status = text => { $('status').textContent = text; };

  const frames = [];
  let nextX = 0;
  for (const t of document.querySelectorAll('#screens template.screen')) {
    const f = { id: t.dataset.id, title: t.dataset.title || t.dataset.id, w: +t.dataset.w || 1100, h: +t.dataset.h || 800, x: nextX, y: 0 };
    nextX += f.w + GAP;
    frames.push(f);
    const el = document.createElement('section');
    el.className = 'frame';
    el.dataset.id = f.id;
    Object.assign(el.style, { left: f.x + 'px', top: f.y + 'px', width: f.w + 'px', height: f.h + 'px' });
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = f.title;
    const iframe = document.createElement('iframe');
    iframe.title = f.title;
    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.srcdoc = CSP + t.innerHTML;
    el.append(label, iframe);
    $('frames').append(el);
  }
  const frameById = id => frames.find(f => f.id === id);

  let comments = [];
  try { comments = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { comments = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(comments)); } catch { status('Selain ei tallenna kommentteja.'); } };

  const view = { x: 40, y: 60, z: 1 };
  function apply() {
    $('world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    $('world').style.setProperty('--inv', String(1 / view.z)); // nastat pysyvät samankokoisina
    $('zoom-reset').textContent = Math.round(view.z * 100) + ' %';
  }
  function zoomAt(z, cx, cy) {
    const n = Math.min(3, Math.max(0.1, z));
    view.x = cx - (cx - view.x) * n / view.z;
    view.y = cy - (cy - view.y) * n / view.z;
    view.z = n;
    apply();
  }
  function zoomCenter(factor) { const r = $('stage').getBoundingClientRect(); zoomAt(view.z * factor, r.width / 2, r.height / 2); }
  function fit() {
    if (!frames.length) return;
    const r = $('stage').getBoundingClientRect(), w = nextX - GAP, h = Math.max(...frames.map(f => f.h)) + 30;
    view.z = Math.max(0.1, Math.min(1, (r.width - 80) / w, (r.height - DOCK - 60) / h));
    view.x = (r.width - w * view.z) / 2;
    view.y = (r.height - DOCK - h * view.z) / 2 + 30 * view.z;
    apply();
  }

  function renderPins() {
    $('pins').replaceChildren();
    comments.forEach((c, i) => {
      const f = frameById(c.frameId);
      if (!f) return;
      const wrap = document.createElement('div');
      wrap.className = 'pin-wrap';
      wrap.style.left = (f.x + c.x) + 'px';
      wrap.style.top = (f.y + c.y) + 'px';
      const pin = document.createElement('button');
      pin.className = 'pin';
      pin.textContent = String(i + 1);
      pin.title = c.text;
      pin.setAttribute('aria-label', `Kommentti ${i + 1}: ${c.text}`);
      pin.onclick = () => edit(c);
      const del = document.createElement('button');
      del.className = 'pin-del';
      del.title = 'Poista kommentti';
      del.setAttribute('aria-label', `Poista kommentti ${i + 1}`);
      del.innerHTML = X_ICON;
      del.onclick = () => remove(c);
      wrap.append(pin, del);
      $('pins').append(wrap);
    });
  }

  let editing = null;
  function edit(c) {
    editing = c;
    $('editor-text').value = c.text || '';
    $('editor-delete').hidden = !c.id;
    $('editor').showModal();
    $('editor-text').focus();
  }
  function remove(c) { comments = comments.filter(a => a.id !== c.id); save(); renderPins(); status('Kommentti poistettu.'); }
  $('editor-save').onclick = () => {
    const text = $('editor-text').value.trim();
    if (!text) { $('editor-text').focus(); return; }
    if (editing.id) editing.text = text;
    else comments.push({ ...editing, id: 'c' + Date.now().toString(36), text });
    $('editor').close();
    save();
    renderPins();
  };
  $('editor-cancel').onclick = () => $('editor').close();
  $('editor-delete').onclick = () => { $('editor').close(); remove(editing); };

  function feedback() {
    const lines = comments.map(c => {
      const f = frameById(c.frameId);
      return `[${c.frameId}] ${f ? f.title : '(poistettu näkymä)'} @ ${Math.round(c.x)},${Math.round(c.y)}: ${c.text}`;
    });
    return [`Kommentit tiedostosta ${decodeURIComponent(location.pathname.split('/').pop())}:`, ...lines].join('\n');
  }
  $('copy').onclick = async () => {
    if (!comments.length) { status('Ei kommentteja kopioitavaksi.'); return; }
    const text = feedback();
    try {
      await navigator.clipboard.writeText(text);
      status('Kopioitu – liitä agentin chattiin.');
    } catch {
      $('copy-text').value = text;
      $('copy-dialog').showModal();
      $('copy-text').select();
    }
  };
  $('copy-close').onclick = () => $('copy-dialog').close();

  let mode = 'move';
  function setMode(m) {
    mode = m;
    $('mode-move').setAttribute('aria-pressed', String(m === 'move'));
    $('mode-comment').setAttribute('aria-pressed', String(m === 'comment'));
    $('stage').classList.toggle('commenting', m === 'comment');
  }
  $('mode-move').onclick = () => setMode('move');
  $('mode-comment').onclick = () => setMode('comment');

  const worldPoint = e => { const r = $('stage').getBoundingClientRect(); return [(e.clientX - r.left - view.x) / view.z, (e.clientY - r.top - view.y) / view.z]; };
  let drag = null;
  $('stage').addEventListener('pointerdown', e => {
    if (e.target.closest('.pin-wrap')) return;
    if (mode === 'comment' && e.button === 0) {
      const [px, py] = worldPoint(e);
      const f = frames.find(f => px >= f.x && px <= f.x + f.w && py >= f.y && py <= f.y + f.h);
      if (f) edit({ frameId: f.id, x: px - f.x, y: py - f.y });
      else status('Klikkaa jotakin näkymää.');
      return;
    }
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    $('stage').setPointerCapture(e.pointerId);
    $('stage').classList.add('dragging');
  });
  $('stage').addEventListener('pointermove', e => {
    if (!drag) return;
    view.x = drag.vx + e.clientX - drag.x;
    view.y = drag.vy + e.clientY - drag.y;
    apply();
  });
  const stopDrag = () => { drag = null; $('stage').classList.remove('dragging'); };
  $('stage').addEventListener('pointerup', stopDrag);
  $('stage').addEventListener('pointercancel', stopDrag);
  $('stage').addEventListener('wheel', e => {
    e.preventDefault();
    const r = $('stage').getBoundingClientRect();
    zoomAt(view.z * Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  $('zoom-in').onclick = () => zoomCenter(1.25);
  $('zoom-out').onclick = () => zoomCenter(0.8);
  $('zoom-reset').onclick = () => zoomCenter(1 / view.z);
  $('fit').onclick = fit;
  window.addEventListener('keydown', e => {
    if (e.target.closest('textarea') || document.querySelector('dialog[open]')) return;
    if (e.key === 'v' || e.key === 'V' || e.key === 'Escape') setMode('move');
    if (e.key === 'c' || e.key === 'C') setMode('comment');
  });

  apply();
  fit();
  renderPins();
  status(frames.length ? '' : 'Lisää näkymät <template class="screen"> -elementteinä.');
})();
</script>
</body>
</html>
